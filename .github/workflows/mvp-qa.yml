name: MVP QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cheonhajangsa-mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/cheonhajangsa-mvp/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:data
      - run: npm test -- --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/mvp-vitest.json"
      - run: npm exec -- tsx scripts/check-golden-report.ts "$RUNNER_TEMP/mvp-vitest.json"
