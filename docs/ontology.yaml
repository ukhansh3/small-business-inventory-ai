version: '0.2'
status: team_review_draft
language: ko
updated_at: '2026-11-04'
domain: 소규모 외식업 점주의 낯선 품목·공급업체 탐색과 판단

purpose: >-
  인터뷰에서 관찰한 공급업체 탐색과 판단 과정을 개념·속성·관계로 정리한다.
  지도, 커뮤니티, AI, API 요청 구조는 문제 도메인의 관찰 사실이 아니므로
  solution_mapping에 별도로 기록한다.

evidence_policy:
  observation: 인터뷰 로그에 기록된 과거 행동만 관찰 근거로 사용한다.
  interpretation: 팀의 해석은 관찰과 분리한다.
  unknown: 질문하지 않았거나 원음에서 확인하지 못한 값은 unknown으로 둔다.
  quote_rule: 직접 인용은 원음 대조 후 익명화한 경우에만 사용한다.
  analyzed_interviews: [I01, I02, I03, I04, I05, I06, I09, I10, I12]
  pending_structure: [I07, I08, I11]
  limitations:
    - 아주대 인근 외식업 표본에 집중돼 다른 지역과 업종으로 일반화할 수 없다.
    - 수정 전 인터뷰에서 묻지 않은 정보 비대칭 항목은 반대 근거가 아니다.
    - 직접 인용과 일부 수치는 원음 대조가 남아 있다.

sources:
  I01:
    kind: interview_log
    path: docs/interviews/logs/I01.md
    summary: 소량 구매와 신선도·근거리 배송·관계를 중시한 사례
  I02:
    kind: interview_log
    path: docs/interviews/logs/I02.md
    summary: 폐유 가격 차이를 알고 업체를 변경하고 수리업체를 탐색한 사례
  I03:
    kind: interview_log
    path: docs/interviews/logs/I03.md
    summary: 네 개 구매 경로와 가격 알림을 쓰며 배송·운반 편의를 함께 고려한 사례
  I04:
    kind: interview_log
    path: docs/interviews/logs/I04.md
    summary: 기존 거래처를 편의성 때문에 유지하고 최근 변경 사건이 없는 반대 사례
  I05:
    kind: interview_log
    path: docs/interviews/logs/I05.md
    summary: 지인과 과거 경험으로 거래처를 찾고 품질을 기준으로 변경한 사례
  I06:
    kind: interview_log
    path: docs/interviews/logs/I06.md
    summary: 빈번한 직접 구매가 있었으나 거래처 탐색 문제는 확인하지 못한 사례
  I07:
    kind: interview_audio_pending_structure
    path: docs/interviews/logs/I07.md
    summary: 원음 구조화 전이므로 개념 주장에 사용하지 않음
  I08:
    kind: interview_audio_pending_structure
    path: docs/interviews/logs/I08.md
    summary: 원음 구조화 전이므로 개념 주장에 사용하지 않음
  I09:
    kind: interview_log
    path: docs/interviews/logs/I09.md
    summary: 경험과 저장 연락처로 하루 안에 변경하고 경쟁 점주와 공유를 꺼린 사례
  I10:
    kind: interview_log
    path: docs/interviews/logs/I10.md
    summary: 가족 소개·가격 비교·운반과 디지털 부담이 함께 나타난 사례
  I11:
    kind: interview_audio_pending_structure
    path: docs/interviews/logs/I11.md
    summary: 원음 구조화 전이므로 개념 주장에 사용하지 않음
  I12:
    kind: interview_log
    path: docs/interviews/logs/I12.md
    summary: 창업 초기에 약 10곳을 방문하고 경험이 쌓인 뒤 탐색 빈도가 감소한 사례

terminology:
  BusinessOwner: 품목·공급업체 선택을 실제로 담당하는 점주
  Store: BusinessOwner가 운영하는 음식점 또는 매장
  Vendor: 품목 또는 외부 서비스를 공급하는 업체
  SupplierCandidate: 한 SearchEpisode에서 비교 대상으로 고려된 Vendor
  Offer: 특정 시점 Vendor가 제공하는 품목·규격·가격·거래 조건 묶음
  SearchEpisode: 하나의 실제 필요에서 시작해 후보 탐색과 비교를 거쳐 끝나는 사건
  PriceRecord: 특정 시점에 확인한 가격 기록이며 실시간 가격 보증이 아님
  TradeExperience: 실제 거래에 대한 자기보고이며 검증 완료 리뷰와 같지 않음

classes:
  BusinessOwner:
    definition: 품목·공급업체 선택을 직접 담당하는 자영업자
    evidence: [I02, I03, I05, I09, I10, I12]
    attributes:
      experience_years:
        type: number
        nullable: true
        evidence: [I03, I04, I05, I09, I10, I12]
      category_experience:
        type: string
        nullable: true
        note: 업력과 별개인 해당 품목·업체 범주의 경험
        evidence: [I05, I09, I12]
      saved_contacts_available:
        type: boolean
        nullable: true
        evidence: [I09]

  ProcurementNeed:
    definition: 새 품목 또는 공급업체를 알아봐야 하는 계기
    evidence: [I02, I05, I09, I12]
    attributes:
      need_type:
        type: enum
        values: [new_item, supplier_failure, price_concern, startup, repair_or_service, unknown]
        evidence: [I02, I05, I09, I12]
      occurred_at:
        type: datetime
        nullable: true
        note: 원음에서 확인하지 못하면 unknown 처리
        evidence: [I09]

  SearchEpisode:
    definition: 필요 발생부터 후보 탐색·비교·선택까지의 실제 사건
    evidence: [I02, I03, I05, I09, I10, I12]
    attributes:
      contacted_vendor_count:
        type: integer
        nullable: true
        min: 0
        evidence: [I03, I05, I12]
      elapsed_time:
        type: string
        nullable: true
        evidence: [I02, I09, I12]
      monetary_cost:
        type: integer
        nullable: true
        min: 0
        currency: KRW
        note: 금액을 확인하지 못한 손실은 null
        evidence: [I09]
      frequency:
        type: string
        nullable: true
        note: 주기 또는 최근 기간 내 발생 횟수. 추정 금지
        evidence: [I03, I10, I12]

  InformationSource:
    definition: 후보와 조건을 알기 위해 실제 사용한 정보 경로
    evidence: [I02, I03, I05, I09, I10, I12]
    attributes:
      source_type:
        type: enum
        values: [search, salesperson, saved_contact, acquaintance, nearby_owner, flyer, direct_visit, prior_experience, unknown]
        evidence: [I02, I03, I05, I09, I10, I12]
      public_or_private:
        type: enum
        values: [public, private_network, first_party, unknown]
        evidence: [I02, I05, I09, I10, I12]

  Vendor:
    definition: 품목 또는 외부 서비스를 공급하는 업체
    evidence: [I01, I02, I03, I04, I05, I09, I10, I12]
    attributes:
      vendor_category:
        type: string
        nullable: true
        evidence: [I02, I05, I09, I12]
      relationship_status:
        type: enum
        values: [candidate, active, replaced, former, unknown]
        evidence: [I02, I04, I05, I09, I12]

  Offer:
    definition: 비교 시점의 품목·규격·가격·배송·최소 주문 등 조건 묶음
    evidence: [I02, I03, I05, I09, I10, I12]
    attributes:
      item_or_service:
        type: string
        nullable: true
        evidence: [I02, I03, I05, I09, I12]
      amount:
        type: integer
        nullable: true
        min: 0
        currency: KRW
        note: 미확인 가격을 0으로 저장하지 않음
        evidence: [I02, I03, I09, I10, I12]
      specification:
        type: string
        nullable: true
        evidence: [I03, I05, I12]
      fulfillment:
        type: enum
        values: [pickup, delivery, both, unknown]
        evidence: [I01, I03, I09]
      minimum_order:
        type: string
        nullable: true
        evidence: [I01, I03]

  DecisionCriterion:
    definition: 후보를 선택·유지·교체할 때 적용한 기준
    evidence: [I01, I03, I04, I05, I09, I10, I12]
    attributes:
      criterion_type:
        type: enum
        values: [price, quality, freshness, delivery_speed, delivery_reliability, carrying_convenience, relationship, vendor_stability, distance, unknown]
        evidence: [I01, I03, I04, I05, I09, I10, I12]
      priority:
        type: integer
        nullable: true
        min: 1
        note: 인터뷰이가 순서를 명시한 경우만 사용
        evidence: [I05, I09, I12]

  SupplierDecision:
    definition: 비교 후 내린 선택·유지·교체·보류 결정
    evidence: [I02, I04, I05, I09, I12]
    attributes:
      action:
        type: enum
        values: [select, keep, replace, postpone, no_choice]
        evidence: [I02, I04, I05, I09, I12]
      decided_at:
        type: datetime
        nullable: true
        evidence: [I09]

  Outcome:
    definition: 선택 이후 관찰한 만족·손실·재탐색·복귀 행동
    evidence: [I02, I09, I12]
    attributes:
      outcome_type:
        type: enum
        values: [continued, switched_again, emergency_purchase, lost_sale, quality_regret, returned_to_previous, unknown]
        evidence: [I02, I09, I12]
      consequence_description:
        type: string
        nullable: true
        note: 금액이 확인되지 않은 긴급 구매·판매 중단·재구매 결과를 서술
        evidence: [I09, I12]

relations:
  - name: encounters
    from: BusinessOwner
    to: ProcurementNeed
    cardinality: '1:N'
    evidence: [I02, I05, I09, I12]
  - name: performs
    from: BusinessOwner
    to: SearchEpisode
    cardinality: '1:N'
    evidence: [I02, I03, I05, I09, I10, I12]
  - name: triggered_by
    from: SearchEpisode
    to: ProcurementNeed
    cardinality: 'N:1'
    evidence: [I02, I09, I12]
  - name: consults
    from: SearchEpisode
    to: InformationSource
    cardinality: 'N:M'
    evidence: [I02, I03, I05, I09, I10, I12]
  - name: considers
    from: SearchEpisode
    to: Vendor
    role_name: SupplierCandidate
    cardinality: 'N:M'
    evidence: [I02, I03, I05, I09, I12]
  - name: compares
    from: SearchEpisode
    to: Offer
    cardinality: 'N:M'
    evidence: [I02, I03, I05, I09, I10, I12]
  - name: offered_by
    from: Offer
    to: Vendor
    cardinality: 'N:1'
    evidence: [I02, I03, I05, I09, I12]
  - name: applies
    from: SearchEpisode
    to: DecisionCriterion
    cardinality: 'N:M'
    evidence: [I01, I03, I04, I05, I09, I10, I12]
  - name: produces
    from: SearchEpisode
    to: SupplierDecision
    cardinality: '1:0..1'
    evidence: [I02, I04, I05, I09, I12]
  - name: selects
    from: SupplierDecision
    to: Vendor
    cardinality: 'N:0..1'
    evidence: [I02, I04, I05, I09, I12]
  - name: results_in
    from: SupplierDecision
    to: Outcome
    cardinality: '1:0..N'
    evidence: [I02, I09, I12]

core_flow:
  - BusinessOwner encounters ProcurementNeed
  - BusinessOwner performs SearchEpisode
  - SearchEpisode consults InformationSource
  - SearchEpisode considers Vendor and compares Offer
  - SearchEpisode applies DecisionCriterion
  - SearchEpisode produces SupplierDecision
  - SupplierDecision results_in Outcome

problem_boundaries:
  includes:
    - 실제 공급업체 탐색 경로
    - 가격·품질·배송·관계 판단 기준
    - 탐색 시간·접촉 수·금전 손실
    - 선택 이후 유지·교체·재탐색 행동
  excludes:
    - 지도 UI
    - 커뮤니티 게시물
    - AI 프롬프트와 검색 요청 DTO
    - 인증·권한·revision 상태
    - 공공데이터 수집 스키마

solution_mapping:
  status: implementation_model_not_interview_evidence
  specification: docs/SPEC.md
  contract: apps/cheonhajangsa-mvp/src/lib/api-types.ts
  dataset_schema: apps/cheonhajangsa-mvp/core/schema.ts
  search_contract: apps/cheonhajangsa-mvp/core/search-types.ts
  parser_schema: apps/cheonhajangsa-mvp/src/cheonhajangsa/schemas/search_vendors.schema.json
  parser_context: 모델은 item_id, qty_kg, urgency, fulfillment를 추출하고 location_id는 앱이 제공한다.
  mappings:
    Vendor: 예시 판매처는 Vendor와 VendorCard로 나타낸다. 공공데이터 Store는 지도 후보이며 실제 거래 조건을 확인한 업체로 간주하지 않는다.
    Offer: 예시 품목·판매 조건은 Offer로 나타낸다. 시연 값은 실제 거래 증거로 사용하지 않는다.
    SearchEpisode: SearchCondition은 검색 도구 입력이다. 도메인의 실제 탐색 사건과 구분한다.
    SupplierDecision: 사용자 테스트의 후보 선택 행동으로 측정한다.
  implementation_only_entities:
    - Store (API의 지도 업체 응답이며 terminology.Store와 의미가 다름)
    - SearchCondition
    - TurnResponse
    - PriceCheck
    - CommunityPost

open_questions:
  - I07, I08, I11 구조화 후 새 개념 또는 반대 근거가 생기는가?
  - 접촉 업체 수·소요 시간·손실 금액을 몇 건에서 수치로 확인할 수 있는가?
  - Offer를 동일 규격으로 비교할 수 있는 데이터가 반복 확보되는가?
  - 공개 정보와 사적 인맥 정보의 경계는 무엇인가?

approval:
  required_reviewers: [김민균, 차승호, 송민혁]
  approved_by: []
  approved_commit: null
