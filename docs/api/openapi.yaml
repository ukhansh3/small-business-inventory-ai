  description: v2.4 기능 명세 + v3.0 통합 설계에서 제시한 API 목표안. 기존 main 구현은 vendors GET 2개만 확인; 신규 route/DTO는 PROPOSED이며
    실제 Zod/DB와 자동 동기화된 것이 아님. 각 endpoint의 해제 상태 및 저장 DTO는 v2.4 개별 명세와 일치하도록 보정했지만 구현 계약은 아님.
servers:
- url: https://example.invalid
  description: 미배포 문서 placeholder — 실제 서버가 아님
