      tags:
      - ai
      summary: post messages — 제안
      description: 제품 UX를 근거로 작성한 기술 제안이며 아직 main에는 구현되지 않음.
      x-implementation-status: PROPOSED
      x-spec-doc: docs/api/ai-assistant/post-messages.md
      security:
      - bearerAuth: []
      responses:
        '401': &id001
          description: 표준 API 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403': *id001
        '404': *id001
        '422': *id001
        '429': *id001
        '503': *id001
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIReply'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - clientMessageId
              - message
              - context
              properties:
                threadId:
                  oneOf:
                  - type: string
                    format: uuid
                  - type: 'null'
                clientMessageId:
                  type: string
                  format: uuid
                message:
                  type: string
                  maxLength: 2000
                context:
                  type: object
                  additionalProperties: false
                  required: &id002 []
                  properties:
                    appliedMapBounds:
                      type: object
                      required:
                      - south
                      - west
                      - north
                      - east
                      properties:
                        south:
                          type: number
                          minimum: -90
                          maximum: 90
                        west:
                          type: number
                          minimum: -180
                          maximum: 180
                        north:
                          type: number
                          minimum: -90
                          maximum: 90
                        east:
                          type: number
                          minimum: -180
                          maximum: 180
                    mapQuery:
                      type: string
                    mapFilters:
                      type: object
