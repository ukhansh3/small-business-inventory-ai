version: '0.1'
status: proposed_team_review
updated_at: '2026-11-04'
purpose: SPEC v0.2의 경계·권한·데이터 구분을 구현 전에 고정한다.

rules:
  required_cases_must_pass: true
  skipped_required_cases: 0
  xfail_required_cases: 0
  fixtures_are_synthetic: true
  external_services_are_stubbed: true

cases:
  - id: G01
    ac: AC01
    title: 승인된 현재 공개본만 검색
    given: 동일 반경에 승인 현재본, 과거 승인본, 검토 대기본, 숨김 업체가 있다.
    when: 로그인 사용자가 업체를 검색한다.
    then: 승인된 현재 공개본의 vendor_id만 반환한다.

  - id: G02
    ac: AC02
    title: 좌표와 반경 경계
    given: 위도 범위 밖 값과 99m, 20001m 반경이 있다.
    when: 검색 요청을 보낸다.
    then: 422이며 DB 검색을 실행하지 않는다.

  - id: G03
    ac: AC03
    title: 결정적 순서
    given: 같은 거리의 업체와 같은 입력 데이터가 있다.
    when: 같은 검색을 세 번 실행한다.
    then: vendor_id 집합과 순서가 세 번 모두 같다.

  - id: G04
    ac: AC04
    title: 배송 지원과 목적지 확인 분리
    given: delivery, pickup, unknown 업체가 있다.
    when: 배송 가능 조건으로 검색한다.
    then: 배송 지원 업체만 나오며 destinationConfirmationRequired가 명시된다.

  - id: G05
    ac: AC05
    title: null과 무료 구분
    given: 가격 null, 배송비 null, 배송비 0인 서로 다른 Offer가 있다.
    when: 상세를 표시한다.
    then: null을 0원·무료로 표시하지 않고 0만 무료로 표시한다.

  - id: G06
    ac: AC06
    title: 가격 확인일 경계
    given: 기준일 대비 30일, 31일, null, 미래 날짜가 있다.
    when: 최신 상태를 판정한다.
    then: 30일은 유효, 31일과 null은 재확인, 미래 날짜 입력은 거부한다.

  - id: G07
    ac: AC07
    title: 비교 불가능 규격
    given: 단위·규격·세금 상태가 다른 두 Offer가 있다.
    when: 비교를 요청한다.
    then: 우열·절감액을 표시하지 않고 불일치 필드를 반환한다.

  - id: G08
    ac: AC08
    title: 지도와 목록 ID 일치
    given: 좌표가 있는 두 업체와 좌표가 없는 한 업체가 검색된다.
    when: 지도와 목록을 표시한다.
    then: 검색 결과 집합은 같고 좌표 없는 업체의 핀만 생성하지 않는다.

  - id: G09
    ac: AC09
    title: 타인 초안 수정 차단
    given: 사용자 A와 사용자 B의 업체 초안이 있다.
    when: A가 B의 초안을 수정한다.
    then: 403이며 DB 값이 바뀌지 않는다.

  - id: G10
    ac: AC10
    title: 승인본 유지와 수정본 재검토
    given: 공개 승인본과 검토 중 수정본이 있다.
    when: 일반 사용자가 조회한다.
    then: 수정본 승인 전에는 기존 승인본을 반환한다.

  - id: G11
    ac: AC11
    title: 자기 업체 승인 차단
    given: 운영자 역할이 자기 업체 revision을 검토한다.
    when: 승인을 요청한다.
    then: 403이며 상태가 pending_review로 유지된다.

  - id: G12
    ac: AC12
    title: 공공업체 시연 데이터 분리
    given: live 업체와 mvp_demo 업체가 있다.
    when: 일반 업체 검색과 시연 검색을 각각 호출한다.
    then: 서로 섞이지 않고 mvp_demo 응답은 고정 경고와 vendor_verified=false를 유지한다.

  - id: G13
    ac: AC13
    title: AI 허위 업체와 외부 지시문 차단
    given: 허용 vendor_id 목록과 지시문이 포함된 외부 텍스트가 있다.
    when: AI 설명을 생성한다.
    then: 허용 목록 밖 ID와 가격이 없고 검색 순서가 바뀌지 않는다.

  - id: G14
    ac: AC15
    title: 결과 없음과 DB 장애 구분
    given: 정상 빈 결과와 DB 연결 실패가 각각 발생한다.
    when: 검색한다.
    then: 빈 결과는 성공 상태, DB 실패는 503이며 샘플 결과로 대체하지 않는다.

  - id: G15
    ac: AC16
    title: 비공개 정보 누출 차단
    given: 다른 사용자의 개인 위치·사진 경로·내부 메모가 있다.
    when: 일반 업체 응답을 만든다.
    then: 해당 필드가 응답에 존재하지 않는다.
